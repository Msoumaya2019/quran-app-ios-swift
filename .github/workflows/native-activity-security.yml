name: Native activity — PostgreSQL authorization tests
on:
  push:
    branches: [main]
    paths: ['Supabase/native-activity*.sql', '.github/workflows/native-activity-security.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: native_activity_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Test schema, owner-only access, disabled collection and idempotency
        env:
          PGPASSWORD: disposable-test-only
        run: psql -h localhost -U postgres -d native_activity_test -v ON_ERROR_STOP=1 -f Supabase/native-activity-security-test.sql
