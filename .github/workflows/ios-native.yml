name: Swift native — Xcode tests and unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Optional XCTest identifier to rerun a specific failed test; empty runs all tests'
        required: false
        default: ''
        type: string
      build_ipa:
        description: 'Generate an unsigned iPhone archive only when device delivery is needed'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  xcode:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare original Coran 1441 offline test pages
        run: |
          curl --fail --retry 3 --location 'https://files.quran.app/hafs/madani_1441/zips/images_1440.zip' -o "$RUNNER_TEMP/coran1441.zip"
          python3 - <<'PY'
          import zipfile, os, wave
          from pathlib import Path
          output=Path('Resources/ReaderTestFixtures'); output.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(os.environ['RUNNER_TEMP']+'/coran1441.zip') as archive:
              for page in range(1,26):
                  for line in range(1,16):
                      (output/f'{page:03d}-{line:02d}.png').write_bytes(archive.read(f'width_1440/{page}/{line}.png'))
          import urllib.request
          for page in [1, 2, 187, 600]:
              font=urllib.request.urlopen(f'https://verses.quran.foundation/fonts/quran/hafs/v4/colrv1/woff2/p{page}.woff2').read()
              if not font.startswith(b'wOF2'): raise SystemExit('Invalid QCF test font')
              (output/f'qcf-p{page}.woff2').write_bytes(font)
          with wave.open(str(output/'audio.wav'),'wb') as audio:
              audio.setnchannels(1); audio.setsampwidth(2); audio.setframerate(8000)
              audio.writeframes(bytes(8000*2*60))
          PY
      - name: Configure public Supabase client
        env:
          SUPABASE_PUBLIC_KEY: ${{ secrets.SUPABASE_PUBLIC_KEY }}
        run: |
          python3 - <<'PY'
          import os, plistlib
          key = os.environ.get('SUPABASE_PUBLIC_KEY', '')
          if not key:
              raise SystemExit('SUPABASE_PUBLIC_KEY repository secret is required')
          with open('Resources/Backend.local.plist', 'wb') as f:
              plistlib.dump({'SUPABASE_URL':'https://npbwnvrqmajwqtnncuyv.supabase.co','SUPABASE_PUBLIC_KEY':key}, f)
          PY
      - name: Generate Xcode project
        run: |
          python3 Scripts/generate_project.py --check
          xcodebuild -version
      - name: Choose available iPhone simulator
        run: |
          python3 - <<'PY'
          import json, subprocess, os
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))['devices']
          choices=[d for runtime, ds in devices.items() if '.iOS-' in runtime for d in ds if 'iPhone' in d['name']]
          phone=next((d for d in choices if 'Pro Max' in d['name']),choices[0])
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('SIMULATOR_ID='+phone['udid']+'\n')
          print(phone['name'])
          PY
      - name: Build and run XCTest / UI tests
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          set -o pipefail
          test_options=()
          if [ -n "$TEST_FILTER" ]; then
            case "$TEST_FILTER" in
              CoranNativeTests|CoranNativeUITests|CoranNativeTests/*|CoranNativeUITests/*) test_options+=("-only-testing:$TEST_FILTER") ;;
              *) echo 'Invalid XCTest identifier'; exit 1 ;;
            esac
            case "$TEST_FILTER" in
              CoranNativeUITests*)
                xcrun simctl boot "$SIMULATOR_ID" || true
                xcrun simctl bootstatus "$SIMULATOR_ID" -b
                test_options+=("-parallel-testing-enabled" "NO")
                ;;
            esac
          fi
          xcodebuild test "${test_options[@]}" -project CoranNative.xcodeproj -scheme CoranNative -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath DerivedData -resultBundlePath artifacts/PhaseOne.xcresult CODE_SIGNING_ALLOWED=NO | tee xcode-tests.log
      - name: Archive unsigned iPhone application
        if: github.event_name == 'workflow_dispatch' && inputs.build_ipa == true
        run: |
          set -o pipefail
          xcodebuild archive -project CoranNative.xcodeproj -scheme CoranNative -destination 'generic/platform=iOS' -archivePath artifacts/CoranNative.xcarchive -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO | tee xcode-archive.log
          mkdir -p artifacts/Payload
          cp -R artifacts/CoranNative.xcarchive/Products/Applications/CoranNative.app artifacts/Payload/
          cd artifacts && zip -qr CoranNative-0.1.0-unsigned.ipa Payload
      - name: Export UI screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path artifacts/PhaseOne.xcresult --output-path artifacts/Screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PhaseOne-Xcode-tests-and-IPA
          path: |
            artifacts/PhaseOne.xcresult
            artifacts/Screenshots
            artifacts/*.ipa
            xcode-*.log
          retention-days: 14
